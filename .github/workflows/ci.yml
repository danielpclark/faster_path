name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: '1'

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }} (${{ matrix.suite.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Rutie 0.13, which the extension is built with, supports Ruby 3.2 to 3.4
        os: [ubuntu-22.04, windows-latest]
        ruby: ['3.2', '3.3', '3.4']
        suite:
          - name: regression
            env: WITH_REGRESSION=true
          - name: monkeypatches
            env: TEST_MONKEYPATCHES=true WITH_REGRESSION=true
          - name: encoding
            env: ENCODING=true TEST_MONKEYPATCHES=true WITH_REGRESSION=true
        include:
          - os: macos-latest
            ruby: '3.4'
            suite:
              name: regression
              env: WITH_REGRESSION=true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: System details
        run: bundle exec rake sysinfo
      - name: Test (cargo, minitest, rubocop, pbench, mspec)
        run: env ${{ matrix.suite.env }} bundle exec rake test
