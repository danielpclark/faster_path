name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_BACKTRACE: '1'

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} on ${{ matrix.os }} (${{ matrix.suite.name }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        # Rutie 0.13, which the extension is built with, supports Ruby 3.2 to 3.4
        os: [ubuntu-22.04, windows-latest]
        ruby: ['3.2', '3.3', '3.4']
        suite:
          - name: regression
            env: WITH_REGRESSION=true
          - name: monkeypatches
            env: TEST_MONKEYPATCHES=true WITH_REGRESSION=true
          - name: encoding
            env: ENCODING=true TEST_MONKEYPATCHES=true WITH_REGRESSION=true
        include:
          - os: macos-latest
            ruby: '3.4'
            suite:
              name: regression
              env: WITH_REGRESSION=true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: System details
        run: bundle exec rake sysinfo
      - name: Test (cargo, minitest, rubocop, pbench, mspec)
        run: env ${{ matrix.suite.env }} bundle exec rake test

  # The prebuilt extension that `gem install` downloads when Cargo is missing:
  # one Ruby per OS (see lib/faster_path/prebuilt.rb). Runs for a version tag
  # and on request, to check the builds before tagging.
  prebuilt:
    name: Prebuilt extension (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - run: bundle exec rake prebuilt
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.os }}
          path: pkg/faster_path-*

  # Attaches the gem and the prebuilt extensions to the GitHub release of a version tag.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [prebuilt]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
      - run: gem build faster_path.gemspec
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilt-*
          merge-multiple: true
          path: pkg
      - run: ls -l pkg *.gem
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            faster_path-*.gem
            pkg/faster_path-*
